name: Google Keep Appium suite

on:
  push:
  pull_request:

jobs:
  compile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile the Appium test suite
        run: mvn --batch-mode --file test-automation/google-keep-appium/pom.xml test-compile
